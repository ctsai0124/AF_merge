{# v1.3.20：AF 校對清冊 ZIP 匯入、取得步驟與書籤一鍵匯入。由 static/af_import.js 放到 AF 上傳區。 #}
<style>
.afi-guide{margin:8px 0 10px;border:1px solid #d6dee8;background:#f7fafd;font-size:12px;color:#334}
.afi-guide>summary{display:block;cursor:pointer;padding:7px 10px;font-weight:700;color:#1a3a5c;list-style:none}
.afi-guide>summary::-webkit-details-marker{display:none}
.afi-guide>summary::before{content:'▸ ';}
.afi-guide[open]>summary::before{content:'▾ ';}
.afi-guide-body{padding:2px 12px 10px}
.afi-guide ol{margin:4px 0 6px 18px;padding:0;line-height:1.7}
.afi-guide code{background:#fff;border:1px solid #d6dee8;padding:0 4px;font-size:12px;user-select:all;word-break:break-all;white-space:normal}
.afi-guide a{color:#1a5c9c}
.afi-warn{color:#8a5a00}
.afi-onekey{margin-top:8px;padding:8px 10px;background:#fff;border:1px dashed #1a3a5c}
.afi-tag{display:inline-block;margin-left:6px;padding:0 6px;border-radius:8px;background:#fff3cd;color:#8a5a00;font-size:11px;border:1px solid #e0b44c}
.afi-bm{display:inline-block;padding:4px 10px;background:#1a3a5c;color:#fff !important;text-decoration:none;border-radius:4px;font-weight:700;cursor:grab}
.afi-pw{margin-top:8px;padding:8px 10px;background:#fff8e6;border:1px solid #e0b44c;font-size:12px}
.afi-pw input[type=password]{width:200px;padding:3px 6px;margin:4px 6px 4px 0}
.afi-msg{margin-top:6px;font-size:12px;word-break:break-all}
.afi-msg.err{color:#b00020}.afi-msg.ok{color:#2a6e3f}.afi-msg.info{color:#1a3a5c}
.afi-banner{display:none;margin:0 0 12px;padding:10px 14px;background:#eaf5ec;border:1px solid #2a6e3f;color:#1d4d2c;font-size:13px}
.afi-banner.err{background:#fdeeee;border-color:#b00020;color:#7a0016}
</style>
<template id="afi-guide-tpl">
  <details class="afi-guide" id="afi-guide">
    <summary>如何從 AF 系統取得檔案（可一鍵匯入）</summary>
    <div class="afi-guide-body">
      <ol>
        <li><b>先登入 <a href="https://ecpa.dgpa.gov.tw/" target="_blank" rel="noopener">eCPA 人事服務網</a></b>，在首頁點「<b>AF:各機關學校用人費用管理資訊系統</b>」。<br>
          （歡迎頁網址 <code>https://fund.dgpa.gov.tw/system/WebMain.aspx</code>，按「進入本系統」；登入後主畫面為 <code>https://fund.dgpa.gov.tw/system/CPA.aspx</code>。開放時間每日 7:00～19:00）</li>
        <li>兼辦多校時，先在右上角「<b>兼辦機關</b>」切換到要處理的學校。</li>
        <li>左側選單「用人費用資料維護」→「資料校對及報表列印」→ 右下「<b>報表列印</b>」。</li>
        <li>報表種類選「<b>校對清冊(A)</b>」，報表格式選 <b>EXCEL</b>，「身分證號密碼」欄填公版密碼 <code>{{ af_public_password }}</code>，按「下載報表」。</li>
        <li>把下載的 <b>.zip</b> 直接拖到下方框內（不用解壓縮、不用轉檔），系統會自動解開。</li>
      </ol>
      <div class="afi-warn">公版密碼是公開的，只用來下載這份報表，請勿拿去當其他系統的密碼。</div>
      <div class="afi-onekey">
        <b>一鍵匯入（免下載、免拖檔）：Edge 擴充功能「AF → aftool 一鍵匯入」</b>
        <span class="afi-tag">商店審核中</span><br>
        安裝後，AF 系統頁面右下角會出現「<b>AF → aftool 一鍵匯入</b>」按鈕（也可按工具列的 AF 圖示）。在「資料校對及報表列印」頁面按一下，就會自動選校對清冊(A)、EXCEL、填公版密碼，取得檔案並送進 aftool 分頁；多校時切換「兼辦機關」後再按一次，會沿用同一個 aftool 分頁。
        <div style="margin-top:6px"><b>審核通過前，可先用開發人員模式安裝：</b></div>
        <ol>
          <li>下載 <a href="{{ af_ext_zip_url }}" download>AF-aftool-extension-{{ af_ext_version }}.zip</a>，在電腦上<b>解壓縮</b>成一個資料夾（放在不會被刪掉的位置）。</li>
          <li>Edge 網址列輸入 <code>edge://extensions</code>，開啟左側（或下方）的「<b>開發人員模式</b>」。</li>
          <li>按「<b>載入解壓縮</b>」，選剛才解壓縮出的資料夾（裡面直接看得到 manifest.json 的那一層）。</li>
          <li>重新整理 AF 系統頁面，右下角就會出現按鈕。</li>
        </ol>
        <span style="color:#777">公務電腦若由機關統一管理，可能禁止開發人員模式或自行安裝擴充功能，請改等商店版或洽資訊人員。擴充功能只在 fund.dgpa.gov.tw 與 aftool.leotsai.me 運作，<a href="/privacy-extension" target="_blank" rel="noopener">隱私權聲明</a>。</span>
        <details style="margin-top:6px"><summary style="cursor:pointer;color:#555">其他方式：書籤（Edge 可能整個擋掉，僅供 Chrome 等瀏覽器備用）</summary>
          把這個按鈕拖到書籤列 →
          <a class="afi-bm" id="afi-bookmarklet" href="#" title="請拖曳到書籤列">AF → aftool</a>
          <button type="button" id="afi-copy-bm" style="font-size:11px;margin-left:4px">複製書籤網址</button><br>
          <span style="color:#777">在 AF 系統頁面按書籤使用。Edge 可能因政策封鎖 javascript: 書籤（只會開出 about:blank#blocked），此時請改用上面的擴充功能或手動下載 ZIP 拖進下方框。</span>
        </details>
      </div>
    </div>
  </details>
</template>
<template id="afi-pw-tpl">
  <div class="afi-pw" id="afi-pw">
    <div id="afi-pw-text">這個 ZIP 不是用公版密碼加密的，請輸入下載時在「身分證號密碼」欄填的密碼：</div>
    <input type="password" id="afi-pw-input" autocomplete="off" aria-label="ZIP 密碼">
    <button type="button" id="afi-pw-ok">解開</button>
    <button type="button" id="afi-pw-cancel">取消</button><br>
    <label><input type="checkbox" id="afi-pw-remember" checked> 記在這台電腦的瀏覽器（不會存到伺服器）</label>
  </div>
</template>
<script src="/static/af_import.js?v={{ app_version }}"></script>
